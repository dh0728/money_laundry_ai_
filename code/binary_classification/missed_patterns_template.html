<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>못 잡은 패턴 시도</title>
<style>
:root {
  color-scheme: light;
  --page: #f4f3ef; --surface: #fcfcfb; --text: #0b0b0b; --text2: #52514e; --muted: #7d7c75;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.05);
  --hit: #2a78d6; --miss: #d03b3b; --out: #9c9b92; --sel: rgba(42,120,214,0.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --text: #f0efec; --text2: #c3c2b7; --muted: #8f8e86;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --hit: #3987e5; --miss: #d03b3b; --out: #6c6b65; --sel: rgba(57,135,229,0.18);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 20px 20px 40px; }
h1 { font-size: 20px; margin: 0 0 2px; font-weight: 650; }
.sub { color: var(--text2); font-size: 13px; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: end; padding: 12px 14px; margin-bottom: 12px; }
.controls label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text2); }
select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 8px; min-width: 120px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; color: var(--text2); background: var(--surface); border: 0; border-right: 1px solid var(--axis); padding: 5px 10px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--text); font-weight: 600; }
.cutinfo { font-size: 12px; color: var(--text2); margin-left: auto; text-align: right; }
.top { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(420px, 1.4fr); gap: 12px; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; padding: 14px; align-content: center; }
.stat .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .k { font-size: 12px; color: var(--text2); }
.stat .s { font-size: 12px; color: var(--muted); }
.matrix { padding: 10px 14px 12px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--text2); }
th:first-child, td:first-child { text-align: left; }
.matrix td.cell { cursor: pointer; }
.matrix td.cell:hover { background: var(--wash); }
.matrix td.on { background: var(--sel); font-weight: 600; }
.matrix tr.total td { font-weight: 600; border-top: 1px solid var(--axis); }
.main { display: grid; grid-template-columns: 330px 1fr; gap: 12px; align-items: start; }
.list { max-height: 82vh; overflow-y: auto; }
.listhead { position: sticky; top: 0; background: var(--surface); padding: 9px 12px; font-size: 12px; color: var(--text2); border-bottom: 1px solid var(--grid); border-radius: 10px 10px 0 0; z-index: 1; }
.item { padding: 8px 12px; border-bottom: 1px solid var(--grid); cursor: pointer; }
.item:hover { background: var(--wash); }
.item.sel { background: var(--sel); }
.item .l1 { display: flex; justify-content: space-between; gap: 8px; }
.item .id { font-weight: 600; }
.item .ty { color: var(--text2); font-size: 12px; }
.item .l2 { font-size: 12px; color: var(--text2); display: flex; justify-content: space-between; gap: 8px; margin-top: 1px; }
.bar { display: flex; gap: 2px; height: 6px; margin-top: 5px; }
.bar i { display: block; height: 100%; border-radius: 2px; min-width: 2px; }
.bar .m { background: var(--miss); } .bar .h { background: var(--hit); } .bar .o { background: var(--out); }
.empty { padding: 28px 14px; color: var(--muted); text-align: center; }
.detail { padding: 14px; min-height: 300px; }
.dhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
.dhead h2 { font-size: 17px; margin: 0; font-weight: 650; }
.dhead .desc { color: var(--text2); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text2); margin: 8px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { flex: none; }
svg.graph { width: 100%; height: auto; display: block; border: 1px solid var(--grid); border-radius: 8px; margin: 6px 0 12px; background: var(--surface); }
.edge { fill: none; stroke-linecap: round; }
.edge.hit { stroke: var(--hit); stroke-width: 1.6; }
.edge.miss { stroke: var(--miss); stroke-width: 3.2; }
.edge.out { stroke: var(--out); stroke-width: 1.4; stroke-dasharray: 5 4; }
.edge.hl { stroke-width: 5; }
.ehit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.elabel { font-size: 11px; fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.elabel.miss { font-weight: 700; }
.elabel.out { fill: var(--muted); }
.node circle { fill: var(--surface); stroke: var(--text2); stroke-width: 1.5; }
.node text { font-size: 11px; fill: var(--text2); text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.node.hl circle { stroke: var(--text); stroke-width: 2.5; }
.lane line { stroke: var(--axis); stroke-width: 1; }
.lane text { font-size: 11px; fill: var(--muted); }
.lane text .nm { font-size: 12px; font-weight: 650; fill: var(--text2); }
.lane.hl line { stroke: var(--text2); stroke-width: 1.6; }
.lane.hl text, .lane.hl text .nm { fill: var(--text); }
line.grid { stroke: var(--grid); stroke-width: 1; }
line.bound { stroke: var(--text2); stroke-width: 1; stroke-dasharray: 2 3; }
text.tick { font-size: 11px; fill: var(--muted); }
text.tick.bound { fill: var(--text2); font-weight: 600; }
.dot.hit { fill: var(--hit); } .dot.miss { fill: var(--miss); } .dot.out { fill: var(--out); }
.viewbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 10px; }
.viewbar .seg button { padding: 4px 10px; font-size: 12.5px; }
.viewbar .hint { font-size: 12px; color: var(--muted); }
.figwrap { overflow-x: auto; margin: 6px 0 12px; }
.figwrap svg.graph { margin: 0; }
.tx { overflow-x: auto; }
.tx td, .tx th { font-size: 12.5px; }
.tx tr.hl td { background: var(--wash); }
.tx td.st { text-align: left; font-weight: 600; }
.tx td.acct, .tx th.acct { text-align: left; }
.tx th.cur, .tx td.cur { background: var(--sel); }
.tx td.sc.x { font-weight: 700; }
.mk { display: inline-block; width: 1.1em; text-align: center; }
.mk.x { color: var(--miss); } .mk.o { color: var(--hit); } .mk.n { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); max-width: 320px; display: none; }
#tip b { font-weight: 650; }
#tip .r { display: flex; justify-content: space-between; gap: 14px; }
#tip .r span:first-child { color: var(--text2); }
@media (max-width: 980px) { .top, .main { grid-template-columns: 1fr; } .list { max-height: 40vh; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>못 잡은 패턴 시도</h1>
  <div class="sub" id="sub"></div>

  <div class="card controls">
    <label>조건 (모델)<select id="fCond"></select></label>
    <label>알림 기준<select id="fCut"></select></label>
    <label>패턴<select id="fType"></select></label>
    <label>시도 상태
      <span class="seg" id="fStatus">
        <button data-v="missed">놓친 거래 있음</button><button data-v="part">일부 놓침</button><button data-v="none">전부 놓침</button><button data-v="any">전체</button>
      </span>
    </label>
    <label>정렬<select id="fSort"><option value="miss">놓친 거래 많은 순</option><option value="rate">놓친 비율 높은 순</option><option value="id">시도 번호 순</option></select></label>
    <div class="cutinfo" id="cutinfo"></div>
  </div>

  <div class="top">
    <div class="card stats" id="stats"></div>
    <div class="card matrix"><table id="matrix"></table></div>
  </div>

  <div class="main">
    <div class="card list" id="list"></div>
    <div class="card detail" id="detail"></div>
  </div>
  <div class="note">무패턴 세탁(패턴 파일에 없는 양성)은 시도 단위가 없어서 이 화면에 없다. 시도가 평가 구간 밖(학습 · 검증 구간)에서 시작했으면 그 거래는 점수가 없어 "구간 밖" 으로 표시한다. 방향키 ↑ ↓ 로 시도를 넘길 수 있다.</div>
</div>
<div id="tip"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const M = D.meta, A = D.attempts, NODES = D.nodes;
// 간선 배열 자리: 0 edge_id, 1 src, 2 dst, 3 시각, 4 금액, 5 통화, 6 결제방식, 7 평가 구간 안(1/0), 8 [조건별 점수], 9 [조건별 컷 비트]
const E_ID = 0, E_SRC = 1, E_DST = 2, E_TS = 3, E_AMT = 4, E_CCY = 5, E_FMT = 6, E_IN = 7, E_SC = 8, E_MASK = 9;
const state = { cond: M.conds.indexOf(M.defCond), cut: M.cuts.indexOf(M.defCut), type: 'ALL', status: 'missed', sort: 'miss', sel: null, view: 'flow', tscale: 'time' };
if (state.cond < 0) state.cond = M.conds.length - 1;
if (state.cut < 0) state.cut = 0;
const TYPES = [...new Set(A.map(a => a.type))].sort((x, y) => (M.typeOrder.indexOf(x) + 99 * (M.typeOrder.indexOf(x) < 0)) - (M.typeOrder.indexOf(y) + 99 * (M.typeOrder.indexOf(y) < 0)));
const $ = id => document.getElementById(id);
const fmtN = n => n.toLocaleString('en-US');
const fmtAmt = v => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isHit = (e, ci, ki) => ((e[E_MASK][ci] >> ki) & 1) === 1;
const eState = (e, ci = state.cond, ki = state.cut) => !e[E_IN] ? 'out' : (isHit(e, ci, ki) ? 'hit' : 'miss');
const ST_TEXT = { hit: '잡음', miss: '놓침', out: '구간 밖' }, ST_MARK = { hit: '○', miss: '✕', out: '–' }, ST_CLS = { hit: 'o', miss: 'x', out: 'n' };
const CLS_TEXT = { all: '전부 잡음', part: '일부 놓침', none: '전부 놓침' };

function stat(a) {
  let nt = 0, nh = 0;
  for (const e of a.e) if (e[E_IN]) { nt++; if (isHit(e, state.cond, state.cut)) nh++; }
  return { n: a.e.length, nt, nh, nm: nt - nh, cls: nh === nt ? 'all' : (nh === 0 ? 'none' : 'part') };
}

// ---------------------------------------------------------------- 필터
function initControls() {
  $('fCond').innerHTML = M.conds.map((c, i) => `<option value="${i}">${esc(c)}</option>`).join('');
  $('fCut').innerHTML = M.cuts.map((c, i) => `<option value="${i}">${esc(c)}</option>`).join('');
  $('fType').innerHTML = `<option value="ALL">전체</option>` + TYPES.map(t => `<option>${esc(t)}</option>`).join('');
  $('fCond').value = state.cond; $('fCut').value = state.cut;
  $('fCond').onchange = e => { state.cond = +e.target.value; render(); };
  $('fCut').onchange = e => { state.cut = +e.target.value; render(); };
  $('fType').onchange = e => { state.type = e.target.value; render(); };
  $('fSort').onchange = e => { state.sort = e.target.value; render(); };
  $('fStatus').onclick = e => { const b = e.target.closest('button'); if (b) { state.status = b.dataset.v; render(); } };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
    const i = current.findIndex(x => x.a.id === state.sel); if (!current.length) return;
    const j = Math.max(0, Math.min(current.length - 1, (i < 0 ? 0 : i + (e.key === 'ArrowDown' ? 1 : -1))));
    state.sel = current[j].a.id; e.preventDefault(); renderList(); renderDetail();
    const el = document.querySelector('.item.sel'); if (el) el.scrollIntoView({ block: 'nearest' });
  });
}

let current = [];   // 지금 목록에 보이는 시도 [{a, s}]
function render() {
  $('fType').value = state.type;
  for (const b of $('fStatus').children) b.setAttribute('aria-pressed', b.dataset.v === state.status);
  const all = A.map(a => ({ a, s: stat(a) }));
  renderStats(all); renderMatrix(all);
  current = all.filter(x => (state.type === 'ALL' || x.a.type === state.type) &&
    (state.status === 'any' || (state.status === 'missed' ? x.s.cls !== 'all' : x.s.cls === state.status)));
  const by = { miss: (x, y) => y.s.nm - x.s.nm || x.a.id - y.a.id, rate: (x, y) => y.s.nm / y.s.nt - x.s.nm / x.s.nt || y.s.nm - x.s.nm || x.a.id - y.a.id, id: (x, y) => x.a.id - y.a.id };
  current.sort(by[state.sort]);
  if (!current.some(x => x.a.id === state.sel)) state.sel = current.length ? current[0].a.id : null;
  renderList(); renderDetail();
  $('cutinfo').innerHTML = `임계값 <b>${M.thr[state.cond][state.cut].toFixed(4)}</b> 이상이면 알림<br>평가 구간 알림 ${fmtN(M.alerts[state.cond][state.cut])}건 / ${fmtN(M.nTest)}건`;
}

function renderStats(all) {
  let nt = 0, nm = 0, part = 0, none = 0;
  for (const x of all) { nt += x.s.nt; nm += x.s.nm; if (x.s.cls === 'part') part++; if (x.s.cls === 'none') none++; }
  const pct = (a, b) => b ? (100 * a / b).toFixed(1) + '%' : '-';
  $('stats').innerHTML =
    `<div class="stat"><div class="k">놓친 패턴 거래</div><div class="v">${fmtN(nm)}</div><div class="s">평가 구간 패턴 거래 ${fmtN(nt)}건 중 ${pct(nm, nt)}</div></div>` +
    `<div class="stat"><div class="k">놓친 거래가 있는 시도</div><div class="v">${fmtN(part + none)}</div><div class="s">시도 ${fmtN(all.length)}개 중 ${pct(part + none, all.length)}</div></div>` +
    `<div class="stat"><div class="k">일부만 놓친 시도</div><div class="v">${fmtN(part)}</div><div class="s">시도 안에서 몇 건만 빠짐</div></div>` +
    `<div class="stat"><div class="k">전부 놓친 시도</div><div class="v">${fmtN(none)}</div><div class="s">평가 구간 거래를 하나도 못 잡음</div></div>`;
}

function renderMatrix(all) {
  const rows = {}; for (const t of TYPES) rows[t] = { all: 0, part: 0, none: 0, nt: 0, nm: 0 };
  for (const x of all) { const r = rows[x.a.type]; r[x.s.cls]++; r.nt += x.s.nt; r.nm += x.s.nm; }
  const tot = { all: 0, part: 0, none: 0, nt: 0, nm: 0 };
  const cell = (t, cls, v) => `<td class="cell${(state.type === t && state.status === cls) ? ' on' : ''}" data-t="${esc(t)}" data-c="${cls}">${fmtN(v)}</td>`;
  let h = `<tr><th>패턴</th><th>시도 수</th><th>전부 잡음</th><th>일부 놓침</th><th>전부 놓침</th><th>놓친 거래 / 패턴 거래</th></tr>`;
  for (const t of TYPES) {
    const r = rows[t]; for (const k in tot) tot[k] += r[k];
    h += `<tr><td>${esc(t)}</td><td>${fmtN(r.all + r.part + r.none)}</td><td>${fmtN(r.all)}</td>${cell(t, 'part', r.part)}${cell(t, 'none', r.none)}<td>${fmtN(r.nm)} / ${fmtN(r.nt)} (${r.nt ? (100 * r.nm / r.nt).toFixed(1) : '-'}%)</td></tr>`;
  }
  h += `<tr class="total"><td>합계</td><td>${fmtN(tot.all + tot.part + tot.none)}</td><td>${fmtN(tot.all)}</td>${cell('ALL', 'part', tot.part)}${cell('ALL', 'none', tot.none)}<td>${fmtN(tot.nm)} / ${fmtN(tot.nt)} (${tot.nt ? (100 * tot.nm / tot.nt).toFixed(1) : '-'}%)</td></tr>`;
  $('matrix').innerHTML = h;
  $('matrix').onclick = e => { const td = e.target.closest('td.cell'); if (td) { state.type = td.dataset.t; state.status = td.dataset.c; render(); } };
}

function renderList() {
  const el = $('list');
  if (!current.length) { el.innerHTML = `<div class="listhead">시도 0개</div><div class="empty">조건에 맞는 시도가 없다</div>`; return; }
  const MAX = 1500, shown = current.slice(0, MAX);
  el.innerHTML = `<div class="listhead">시도 ${fmtN(current.length)}개${current.length > MAX ? ` (앞 ${fmtN(MAX)}개만 표시)` : ''}</div>` + shown.map(({ a, s }) => {
    const o = s.n - s.nt;
    return `<div class="item${a.id === state.sel ? ' sel' : ''}" data-id="${a.id}">
      <div class="l1"><span class="id">#${a.id}</span><span class="ty">${esc(a.type)}</span></div>
      <div class="l2"><span>놓침 ${s.nm} / 평가 구간 ${s.nt}건</span><span>${o ? `구간 밖 ${o}건` : ''}</span></div>
      <div class="bar">${s.nm ? `<i class="m" style="flex:${s.nm}"></i>` : ''}${s.nh ? `<i class="h" style="flex:${s.nh}"></i>` : ''}${o ? `<i class="o" style="flex:${o}"></i>` : ''}</div></div>`;
  }).join('');
  el.onclick = e => { const it = e.target.closest('.item'); if (it) { state.sel = +it.dataset.id; renderList(); renderDetail(); } };
}

// ---------------------------------------------------------------- 그래프 배치 (작은 그래프용 힘 기반 배치, 매번 같은 결과)
const W = 820, H = 470, R = 11;
function forceLayout(n, pairs) {
  // 연결된 덩어리 하나를 배치한다. 간선 길이가 대략 k 가 되도록 밀고 당긴다
  if (n === 1) return [[0, 0]];
  const P = Array.from({ length: n }, (_, i) => { const a = 2 * Math.PI * i / n - Math.PI / 2; return [Math.cos(a) * 100, Math.sin(a) * 100]; });
  const k = 90; let t = 40;
  for (let it = 0; it < 400; it++) {
    const F = P.map(() => [0, 0]);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      let dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1], d = Math.hypot(dx, dy) || 0.01, f = k * k / d;
      F[i][0] += dx / d * f; F[i][1] += dy / d * f; F[j][0] -= dx / d * f; F[j][1] -= dy / d * f;
    }
    for (const [i, j] of pairs) {
      let dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1], d = Math.hypot(dx, dy) || 0.01, f = d * d / k;
      F[i][0] -= dx / d * f; F[i][1] -= dy / d * f; F[j][0] += dx / d * f; F[j][1] += dy / d * f;
    }
    for (let i = 0; i < n; i++) {
      const m = Math.hypot(F[i][0], F[i][1]) || 0.01, s = Math.min(m, t) / m;
      P[i][0] += F[i][0] * s; P[i][1] += F[i][1] * s;
    }
    t *= 0.99;
  }
  return P;
}

function layout(n, pairs) {
  // 떨어진 덩어리(연결 요소) 마다 따로 배치한 뒤 줄 맞춰 늘어놓는다. 돌려주는 값: 노드 좌표, 그림 영역 크기
  const comp = Array.from({ length: n }, (_, i) => i), find = i => comp[i] === i ? i : (comp[i] = find(comp[i]));
  for (const [i, j] of pairs) comp[find(i)] = find(j);
  const groups = new Map(); for (let i = 0; i < n; i++) { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(i); }
  const boxes = [...groups.values()].map(members => {
    const local = new Map(members.map((v, i) => [v, i]));
    const P = forceLayout(members.length, pairs.filter(p => local.has(p[0])).map(p => [local.get(p[0]), local.get(p[1])]));
    const xs = P.map(p => p[0]), ys = P.map(p => p[1]), x0 = Math.min(...xs), y0 = Math.min(...ys);
    return { members, P: P.map(p => [p[0] - x0, p[1] - y0]), w: Math.max(...xs) - x0, h: Math.max(...ys) - y0 };
  });
  const GAP = 80, area = boxes.reduce((s, b) => s + (b.w + GAP) * (b.h + GAP), 0), rowW = Math.max(Math.sqrt(area * 1.75), ...boxes.map(b => b.w));
  let x = 0, y = 0, rowH = 0, cw = 0; const out = new Array(n);
  for (const b of boxes) {                                              // 덩어리는 시간순으로 처음 나온 순서
    if (x > 0 && x + b.w > rowW) { x = 0; y += rowH + GAP; rowH = 0; }
    b.members.forEach((v, i) => { out[v] = [x + b.P[i][0], y + b.P[i][1]]; });
    x += b.w + GAP; rowH = Math.max(rowH, b.h); cw = Math.max(cw, x - GAP);
  }
  const ch = y + rowH, padX = 70, padY = 52;
  // 작은 그래프는 그림 영역에 맞게 키우고 (상한 1.9배), 큰 그래프는 줄이지 않고 그림 영역을 넓힌다 (노드가 겹치지 않게)
  const s = Math.max(1, Math.min((W - 2 * padX) / Math.max(cw, 1), (H - 2 * padY) / Math.max(ch, 1), 1.9));
  const vw = Math.max(W, cw * s + 2 * padX), vh = Math.max(H, ch * s + 2 * padY);
  return { P: out.map(p => [(vw - cw * s) / 2 + p[0] * s, (vh - ch * s) / 2 + p[1] * s]), vw, vh };
}

// ---------------------------------------------------------------- 흐름 배치: 가로 = 돈이 흐르는 단계 (왼쪽 → 오른쪽), 세로 = 같은 단계 안에서 거래 시각이 빠른 순 (위 → 아래)
function flowLayout(n, dpairs) {
  // dpairs: 시간순의 (송신, 수신) 쌍 (중복 · 자기 자신 제외). 되돌아오는 간선(사이클을 닫는 간선) 은 단계 계산에서 빼고 back 으로 돌려준다
  const out = Array.from({ length: n }, () => []), indeg = new Array(n).fill(0), back = new Set();
  const reach = (from, to) => { const st = [from], seen = new Set([from]); while (st.length) { const u = st.pop(); if (u === to) return true; for (const v of out[u]) if (!seen.has(v)) { seen.add(v); st.push(v); } } return false; };
  for (const [u, v] of dpairs) { if (reach(v, u)) back.add(u + '>' + v); else { out[u].push(v); indeg[v]++; } }
  const layer = new Array(n).fill(0);
  for (let it = 0; it < n; it++) { let ch = false; for (let u = 0; u < n; u++) for (const v of out[u]) if (layer[v] < layer[u] + 1) { layer[v] = layer[u] + 1; ch = true; } if (!ch) break; }
  for (let u = 0; u < n; u++) if (indeg[u] === 0 && out[u].length) layer[u] = Math.min(...out[u].map(v => layer[v])) - 1;   // 보내기만 하는 계좌는 받는 쪽 바로 왼쪽 칸으로
  const maxL = Math.max(...layer), cols = Array.from({ length: maxL + 1 }, () => []);
  for (let i = 0; i < n; i++) cols[layer[i]].push(i);                       // i 는 시간순으로 처음 나온 순서라 칸 안에서 그대로 위 → 아래
  const padX = 80, padY = 46, rowGap = 40, colGap = Math.max(130, Math.min(260, (W - 2 * padX) / Math.max(maxL, 1)));
  const maxK = Math.max(...cols.map(c => c.length)), cw = maxL * colGap, ch = (maxK - 1) * rowGap;
  const vw = Math.max(W, cw + 2 * padX), vh = Math.max(250, ch + 2 * padY + 20), P = new Array(n);
  cols.forEach((c, ci) => c.forEach((v, k) => { P[v] = [(vw - cw) / 2 + ci * colGap, vh / 2 + (k - (c.length - 1) / 2) * rowGap]; }));
  return { P, vw, vh, back };
}

// ---------------------------------------------------------------- 그림 1: 구조 그래프 (계좌 = 원, 거래 = 화살표)
function drawGraph(edges, ids, idx, nodeName, flowMode) {
  const pairKey = (u, v) => u < v ? u + '|' + v : v + '|' + u;
  const groups = new Map();
  edges.forEach((e, i) => { const k = pairKey(e[E_SRC], e[E_DST]); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); });
  const pairs = [...groups.keys()].map(k => k.split('|').map(v => idx.get(+v))).filter(p => p[0] !== p[1]);
  const deg = new Map(); for (const e of edges) for (const v of [e[E_SRC], e[E_DST]]) deg.set(v, (deg.get(v) || 0) + 1);
  let P, vw, vh, back = new Set();
  if (flowMode) {
    const seen = new Set(), dpairs = [];
    for (const e of edges) { const u = idx.get(e[E_SRC]), v = idx.get(e[E_DST]), k = u + '>' + v; if (u !== v && !seen.has(k)) { seen.add(k); dpairs.push([u, v]); } }
    ({ P, vw, vh, back } = flowLayout(ids.length, dpairs));
  } else ({ P, vw, vh } = layout(ids.length, pairs));
  const nearNode = (p0, p1, skipA, skipB) => P.some((q, i) => {            // 선분 p0-p1 이 다른 계좌 원을 스치나
    if (i === skipA || i === skipB) return false;
    const dx = p1[0] - p0[0], dy = p1[1] - p0[1], l2 = dx * dx + dy * dy || 1, t = Math.max(0, Math.min(1, ((q[0] - p0[0]) * dx + (q[1] - p0[1]) * dy) / l2));
    return Math.hypot(p0[0] + t * dx - q[0], p0[1] + t * dy - q[1]) < R + 7;
  });
  let gEdges = '', gHits = '', gLabels = '';
  for (const [k, list] of groups) {
    const [u, v] = k.split('|').map(Number), pu = P[idx.get(u)], pv = P[idx.get(v)], m = list.length;
    list.forEach((ei, j) => {
      const e = edges[ei], st = eState(e), lab = (st === 'miss' ? '✕' : '') + (ei + 1);
      let d, lx, ly;
      if (u === v) {                                                          // 자기 자신에게 보낸 거래
        const r = 22 + j * 11; d = `M ${pu[0] - 7} ${pu[1] - R + 2} C ${pu[0] - r * 1.6} ${pu[1] - r * 2.4}, ${pu[0] + r * 1.6} ${pu[1] - r * 2.4}, ${pu[0] + 7} ${pu[1] - R - 3}`;
        lx = pu[0]; ly = pu[1] - r * 1.75 - 4;
      } else {
        const a0 = e[E_SRC] === u ? pu : pv, a1 = e[E_SRC] === u ? pv : pu;
        const dx = pv[0] - pu[0], dy = pv[1] - pu[1], len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;   // 법선은 (작은 번호 → 큰 번호) 기준으로 고정
        let off = (j - (m - 1) / 2) * 26;
        if (flowMode && m === 1) {                                            // 흐름 배치: 되돌아오는 간선과 다른 계좌를 지나가는 간선은 휘어서 구분
          const isBack = back.has(idx.get(e[E_SRC]) + '>' + idx.get(e[E_DST]));
          if (isBack || nearNode(pu, pv, idx.get(u), idx.get(v))) off = (Math.abs(ny) > 0.01 ? Math.sign(ny) : 1) * (isBack ? 1 : -1) * Math.min(34 + len * 0.09, 90);   // 되돌아오는 간선은 아래로, 건너뛰는 간선은 위로
        }
        const cx = (pu[0] + pv[0]) / 2 + nx * off * 2, cy = (pu[1] + pv[1]) / 2 + ny * off * 2;
        const trim = (p, c, r) => { const tx = c[0] - p[0], ty = c[1] - p[1], tl = Math.hypot(tx, ty) || 1; return [p[0] + tx / tl * r, p[1] + ty / tl * r]; };
        const s0 = trim(a0, [cx, cy], R + 1), s1 = trim(a1, [cx, cy], R + 9);
        d = `M ${s0[0].toFixed(1)} ${s0[1].toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${s1[0].toFixed(1)} ${s1[1].toFixed(1)}`;
        const ds = deg.get(e[E_SRC]), dd = deg.get(e[E_DST]), t = ds < dd ? 0.3 : (ds > dd ? 0.7 : 0.5), q = 1 - t;      // 번호는 선이 덜 몰리는 쪽(거래가 적은 계좌 쪽) 에
        lx = q * q * s0[0] + 2 * q * t * cx + t * t * s1[0]; ly = q * q * s0[1] + 2 * q * t * cy + t * t * s1[1];
      }
      gEdges += `<path class="edge ${st}" data-e="${ei}" d="${d}" marker-end="url(#ar-${st})"/>`;
      gHits += `<path class="ehit" data-e="${ei}" d="${d}"/>`;
      gLabels += `<text class="elabel ${st}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}">${lab}</text>`;
    });
  }
  const gNodes = ids.map((v, i) => `<g class="node" data-n="${v}"><circle cx="${P[i][0].toFixed(1)}" cy="${P[i][1].toFixed(1)}" r="${R}"/><text x="${P[i][0].toFixed(1)}" y="${(P[i][1] + R + 11).toFixed(1)}">${nodeName(v)}</text></g>`).join('');
  return { vw, vh, body: gEdges + gNodes + gLabels + gHits };
}

// ---------------------------------------------------------------- 그림 2: 시간축 (계좌 = 줄, 거래 = 그 시각에 송신 줄에서 수신 줄로 가는 화살표)
const parseTs = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10), +s.slice(11, 13), +s.slice(14, 16));
const p2 = v => String(v).padStart(2, '0');
const dayLabel = ms => { const d = new Date(ms); return p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); };
const DAY = 86400000;
function drawTime(edges, ids, idx, nodeName, horiz) {
  const n = edges.length, L = ids.length, T = edges.map(e => parseTs(e[E_TS])), ordinal = state.tscale === 'order';
  const laneGap = horiz ? 34 : 64, pad = 22;
  const m = horiz ? { l: 176, r: 28, t: 30, b: 46 } : { l: 104, r: 28, t: 48, b: 22 };
  const laneLen = (L - 1) * laneGap;
  const tLen = horiz ? Math.max(W - m.l - m.r, ordinal ? n * 30 : 0) : Math.max(ordinal ? n * 28 : 520, 300);
  const vw = horiz ? m.l + tLen + m.r : Math.max(W, m.l + laneLen + m.r + 60);
  const vh = horiz ? m.t + laneLen + m.b : m.t + tLen + m.b;
  const laneOff = horiz ? m.t : m.l + ((vw - m.l - m.r) - laneLen) / 2;       // 세로 보기는 줄들을 가운데로
  const t0 = T[0], span = Math.max(T[n - 1] - t0, 60000);
  const lin = ms => pad + (ms - t0) / span * (tLen - 2 * pad);
  const tp = i => ordinal ? (n === 1 ? tLen / 2 : pad + i * (tLen - 2 * pad) / (n - 1)) : lin(T[i]);
  const XY = (t, l) => horiz ? [m.l + t, laneOff + l] : [laneOff + l, m.t + t];
  const f = v => v.toFixed(1);
  const cross = (t, cls, label, where) => {                                 // 시간 방향에 수직인 선 하나 + 글자 (where: 'axis' 눈금 쪽, 'far' 반대쪽)
    const [x0, y0] = XY(t, -14), [x1, y1] = XY(t, laneLen + 14);
    let txt = '';
    const anchor = t > tLen * 0.85 ? 'end' : (t < tLen * 0.15 && where === 'far' ? 'start' : 'middle');     // 가장자리에서 글자가 잘리지 않게
    if (label) txt = horiz
      ? `<text class="tick ${cls}" x="${f(x0)}" y="${where === 'far' ? f(y0 - 5) : f(y1 + 15)}" text-anchor="${where === 'far' ? anchor : 'middle'}">${label}</text>`
      : (where === 'far' ? `<text class="tick ${cls}" x="${f(x1)}" y="${f(y0 - 5)}" text-anchor="end">${label}</text>`
                         : `<text class="tick ${cls}" x="${f(m.l - 10)}" y="${f(y0)}" text-anchor="end" dominant-baseline="central">${label}</text>`);
    return `<line class="${cls}" x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}"/>` + txt;
  };
  let g = '';
  // 시간 눈금
  if (!ordinal) {
    const steps = [600000, 1800000, 3600000, 3 * 3600000, 6 * 3600000, 12 * 3600000, DAY, 2 * DAY, 7 * DAY, 14 * DAY, 28 * DAY];
    const step = steps.find(st => span / st <= (horiz ? 8 : 12)) || steps[steps.length - 1];
    for (let ms = Math.ceil(t0 / step) * step; ms <= T[n - 1]; ms += step) {
      const d = new Date(ms), midnight = d.getUTCHours() === 0 && d.getUTCMinutes() === 0;
      g += cross(lin(ms), 'grid', midnight ? dayLabel(ms) : p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()), 'axis');
    }
    if (span <= 60000 || Math.ceil(t0 / step) * step > T[n - 1]) g += cross(lin(t0), 'grid', edges[0][E_TS].slice(5), 'axis');   // 눈금이 하나도 안 걸리면 첫 시각만
  } else {
    const gap = n > 1 ? (tLen - 2 * pad) / (n - 1) : 0;
    for (let i = 0; i < n; i++) if (i === 0 || Math.floor(T[i] / DAY) !== Math.floor(T[i - 1] / DAY)) g += cross(tp(i) - (i ? gap / 2 : 10), 'grid', dayLabel(T[i]) + ' ~', 'axis');   // 날짜가 바뀌는 자리
  }
  // 평가 구간 경계
  const [ws, we] = M.window.split(' ~ ').map(d => parseTs(d + ' 00:00')), bounds = [[ws, '평가 구간 시작'], [we + DAY, '평가 구간 끝']];
  if (!ordinal) { for (const [ms, lab] of bounds) if (ms > t0 && ms < T[n - 1]) g += cross(lin(ms), 'bound', lab, 'far'); }
  else for (let i = 1; i < n; i++) if (edges[i][E_IN] !== edges[i - 1][E_IN]) g += cross((tp(i) + tp(i - 1)) / 2, 'bound', edges[i][E_IN] ? '평가 구간 시작' : '평가 구간 끝', 'far');
  // 계좌 줄
  ids.forEach((v, i) => {
    const [x0, y0] = XY(0, i * laneGap), [x1, y1] = XY(tLen, i * laneGap);
    const lab = horiz
      ? `<text x="${f(m.l - 12)}" y="${f(y0)}" text-anchor="end" dominant-baseline="central"><tspan class="nm">${nodeName(v)}</tspan> ${esc(NODES[v] || v)}</text>`
      : `<text x="${f(x0)}" y="${f(m.t - 16)}" text-anchor="middle"><tspan class="nm">${nodeName(v)}</tspan><title>${esc(NODES[v] || v)}</title></text>`;
    g += `<g class="lane" data-n="${v}"><line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}"/>${lab}</g>`;
  });
  g += horiz ? `<text class="tick" x="${f(m.l + tLen)}" y="${f(vh - 6)}" text-anchor="end">시간 →${ordinal ? ' (순서대로 같은 간격)' : ''}</text>`
             : `<text class="tick" x="10" y="16">시간 ↓${ordinal ? ' (순서대로 같은 간격)' : ''}</text>`;
  // 거래
  let gE = '', gH = '', gL = '';
  edges.forEach((e, ei) => {
    const st = eState(e), lab = (st === 'miss' ? '✕' : '') + (ei + 1), t = tp(ei), a = idx.get(e[E_SRC]) * laneGap, b = idx.get(e[E_DST]) * laneGap;
    const [sx, sy] = XY(t, a);
    let d, lx, ly;
    if (a === b) {                                                            // 자기 자신에게 보낸 거래 — 줄 위의 작은 고리
      d = `M ${f(sx - 7)} ${f(sy)} a 7 7 0 1 1 14 0 a 7 7 0 1 1 -14 0`; [lx, ly] = horiz ? [sx, sy - 16] : [sx - 18, sy];
      gE += `<path class="edge ${st}" data-e="${ei}" d="${d}"/>`;
    } else {
      const sg = b > a ? 1 : -1, [ex, ey] = XY(t, b - sg * 10);
      d = `M ${f(sx)} ${f(sy)} L ${f(ex)} ${f(ey)}`; [lx, ly] = horiz ? [sx, sy - sg * 12] : [sx - sg * 14, sy];
      gE += `<path class="edge ${st}" data-e="${ei}" d="${d}" marker-end="url(#ar-${st})"/><circle class="dot ${st}" cx="${f(sx)}" cy="${f(sy)}" r="3.2"/>`;
    }
    gH += `<path class="ehit" data-e="${ei}" d="${d}"/>`;
    gL += `<text class="elabel ${st}" x="${f(lx)}" y="${f(ly)}">${lab}</text>`;
  });
  return { vw, vh, body: g + gE + gL + gH };
}

function renderDetail() {
  const el = $('detail'), x = current.find(c => c.a.id === state.sel);
  if (!x) { el.innerHTML = `<div class="empty">왼쪽에서 시도를 고르면 여기에 그려진다</div>`; return; }
  const { a, s } = x, edges = a.e;
  // 계좌 = 노드. 시간순으로 처음 나온 순서대로 A, B, C… 이름을 준다
  const ids = []; const idx = new Map();
  for (const e of edges) for (const v of [e[E_SRC], e[E_DST]]) if (!idx.has(v)) { idx.set(v, ids.length); ids.push(v); }
  const nodeName = v => { const i = idx.get(v); return String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : ''); };
  const isGraph = state.view === 'flow' || state.view === 'graph';
  const fig = isGraph ? drawGraph(edges, ids, idx, nodeName, state.view === 'flow') : drawTime(edges, ids, idx, nodeName, state.view === 'timeh');
  const marker = st => `<marker id="ar-${st}" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L9 5 L0 9.2 z" fill="var(--${st})"/></marker>`;
  const sw = st => `<svg width="34" height="10"><path class="edge ${st}" d="M2 5 H32"/></svg>`;
  const segBtn = (key, v, label) => `<button data-k="${key}" data-v="${v}" aria-pressed="${state[key] === v}">${label}</button>`;
  const hint = state.view === 'flow' ? '왼쪽 → 오른쪽 = 돈이 흐르는 순서, 위 → 아래 = 거래 시각이 빠른 순. 휜 화살표 = 앞 단계로 되돌아오는 거래' : state.view === 'graph' ? '원 = 계좌, 화살표 = 거래 (위치에 뜻 없음)' : (state.view === 'timeh' ? '가로 = 시간, 줄 = 계좌. 화살표는 그 시각에 송신 계좌 줄(점)에서 수신 계좌 줄로' : '세로 = 시간 (위에서 아래로), 줄 = 계좌. 화살표는 그 시각에 송신 계좌 줄(점)에서 수신 계좌 줄로');

  const condCols = M.conds.map((c, ci) => `<th class="${ci === state.cond ? 'cur' : ''}">${esc(c)}</th>`).join('');
  const rows = edges.map((e, ei) => {
    const st = eState(e);
    const sc = M.conds.map((c, ci) => {
      if (!e[E_IN]) return `<td class="sc${ci === state.cond ? ' cur' : ''}"><span class="mk n">–</span></td>`;
      const h = isHit(e, ci, state.cut);
      return `<td class="sc${ci === state.cond ? ' cur' : ''}${h ? '' : ' x'}"><span class="mk ${h ? 'o' : 'x'}">${h ? '○' : '✕'}</span>${e[E_SC][ci].toFixed(4)}</td>`;
    }).join('');
    return `<tr data-e="${ei}"><td>${ei + 1}</td><td class="st"><span class="mk ${ST_CLS[st]}">${ST_MARK[st]}</span>${ST_TEXT[st]}</td><td>${esc(e[E_TS])}</td>
      <td class="acct"><b>${nodeName(e[E_SRC])}</b> ${esc(NODES[e[E_SRC]] || e[E_SRC])}</td><td class="acct"><b>${nodeName(e[E_DST])}</b> ${esc(NODES[e[E_DST]] || e[E_DST])}</td>
      <td>${fmtAmt(e[E_AMT])}</td><td class="acct">${esc(e[E_CCY])}</td><td class="acct">${esc(e[E_FMT])}</td>${sc}</tr>`;
  }).join('');

  el.innerHTML = `
    <div class="dhead"><h2>시도 #${a.id} · ${esc(a.type)} <span class="desc">${esc(a.desc || '')}</span></h2>
      <div class="desc">${CLS_TEXT[s.cls]} — 평가 구간 ${s.nt}건 중 잡음 ${s.nh} · 놓침 ${s.nm}${s.n - s.nt ? ` · 구간 밖 ${s.n - s.nt}건` : ''} · 계좌 ${ids.length}개 · ${esc(edges[0][E_TS])} ~ ${esc(edges[edges.length - 1][E_TS])}</div></div>
    <div class="viewbar"><span class="seg">${segBtn('view', 'flow', '흐름 순서')}${segBtn('view', 'graph', '자유 배치')}${segBtn('view', 'timeh', '시간축 가로')}${segBtn('view', 'timev', '시간축 세로')}</span>
      ${isGraph ? '' : `<span class="seg">${segBtn('tscale', 'time', '실제 시간 간격')}${segBtn('tscale', 'order', '순서대로')}</span>`}<span class="hint">${hint}</span></div>
    <div class="legend"><span>${sw('miss')}✕ 놓침 (임계값 미만)</span><span>${sw('hit')}○ 잡음</span><span>${sw('out')}– 평가 구간 밖 (점수 없음)</span><span>숫자 = 시간순 거래 번호 (아래 표의 #)</span></div>
    <div class="figwrap"><svg class="graph" viewBox="0 0 ${fig.vw.toFixed(0)} ${fig.vh.toFixed(0)}" style="min-width:${Math.min(fig.vw, 2400) > W * 1.6 ? (fig.vw * 0.62).toFixed(0) + 'px' : '0'}" role="img" aria-label="시도 ${a.id} 의 거래 그림"><defs>${marker('hit')}${marker('miss')}${marker('out')}</defs>${fig.body}</svg></div>
    <div class="tx"><table><tr><th>#</th><th style="text-align:left">상태</th><th>시각</th><th class="acct">송신 계좌</th><th class="acct">수신 계좌</th><th>금액 (수취)</th><th class="acct">통화</th><th class="acct">결제방식</th>${condCols}</tr>${rows}</table></div>
    <div class="note">조건 열의 숫자는 그 조건 모델의 점수, ○ ✕ 는 지금 고른 알림 기준에서 잡혔는지다. 색칠된 열이 지금 보고 있는 조건이다.</div>`;

  el.querySelector('.viewbar').onclick = ev => { const b = ev.target.closest('button'); if (b) { state[b.dataset.k] = b.dataset.v; renderDetail(); } };
  // 호버: 거래 ↔ 표의 행
  const svg = el.querySelector('svg.graph'), tip = $('tip');
  const hl = (ei, on) => {
    svg.querySelectorAll(`.edge[data-e="${ei}"]`).forEach(p => p.classList.toggle('hl', on));
    el.querySelectorAll(`.tx tr[data-e="${ei}"]`).forEach(r => r.classList.toggle('hl', on));
    const e = edges[ei]; for (const v of [e[E_SRC], e[E_DST]]) svg.querySelectorAll(`[data-n="${v}"]`).forEach(g => g.classList.toggle('hl', on));
  };
  const place = ev => { const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + pad, y = ev.clientY + pad; if (x + w > innerWidth - 8) x = ev.clientX - w - pad; if (y + h > innerHeight - 8) y = ev.clientY - h - pad; tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; };
  svg.querySelectorAll('.ehit').forEach(p => {
    const ei = +p.dataset.e, e = edges[ei], st = eState(e);
    p.addEventListener('mouseenter', ev => {
      hl(ei, true);
      tip.innerHTML = `<div><b>#${ei + 1} · ${ST_MARK[st]} ${ST_TEXT[st]}</b></div><div class="r"><span>시각</span><span>${esc(e[E_TS])}</span></div>
        <div class="r"><span>${nodeName(e[E_SRC])} → ${nodeName(e[E_DST])}</span><span>${fmtAmt(e[E_AMT])} ${esc(e[E_CCY])}</span></div><div class="r"><span>결제방식</span><span>${esc(e[E_FMT])}</span></div>` +
        (e[E_IN] ? M.conds.map((c, ci) => `<div class="r"><span>${ci === state.cond ? '<b>' + esc(c) + '</b>' : esc(c)}</span><span>${isHit(e, ci, state.cut) ? '○' : '✕'} ${e[E_SC][ci].toFixed(4)}</span></div>`).join('') : `<div class="r"><span>점수</span><span>평가 구간 밖</span></div>`);
      tip.style.display = 'block'; place(ev);
    });
    p.addEventListener('mousemove', place);
    p.addEventListener('mouseleave', () => { hl(ei, false); tip.style.display = 'none'; });
  });
  el.querySelectorAll('.tx tr[data-e]').forEach(r => { const ei = +r.dataset.e; r.addEventListener('mouseenter', () => hl(ei, true)); r.addEventListener('mouseleave', () => hl(ei, false)); });
}

$('sub').textContent = `${M.dataset} · 결과 폴더 ${M.run} · 평가 구간 ${M.window} · 이 구간에 거래가 있는 패턴 시도 ${fmtN(A.length)}개 · 생성 ${M.generated}`;
initControls(); render();
</script>
</body>
</html>
